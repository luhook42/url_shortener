x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    restart: unless-stopped
    logging: *default-logging
    build: .
    image: us-central1-docker.pkg.dev/project-e985c781-9e31-44bf-bee/shortener/web:${WEB_TAG:-dev}
    ports:
      - "4567:4567"
    environment:
      RACK_ENV: ${RACK_ENV:-production}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
    depends_on:
      - db
      - redis

  db:
    restart: unless-stopped
    logging: *default-logging
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    restart: unless-stopped
    logging: *default-logging
    image: redis:7.4.11
    command:
      [
        "redis-server",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]

volumes:
  pgdata:
