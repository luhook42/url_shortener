name: Rollback

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit ID to deploy (a version that worked)"
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Validate commit ID
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{7,40}$ ]] || { echo "Not a commit ID"; exit 1; }
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy that commit
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          SHA: ${{ inputs.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" \
            "cd ~/url_shortener && git fetch origin && git checkout --detach $SHA && sudo docker compose up -d --build"
      - name: Check health
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" \
            'for i in $(seq 1 15); do curl -fsS http://localhost:4567/health && exit 0; sleep 2; done; exit 1'
