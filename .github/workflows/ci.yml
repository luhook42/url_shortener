name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.11
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RACK_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/url_shortener_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"
          bundler-cache: true
      - run: bundle exec rake db:create db:migrate
      - run: bundle exec rake test
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-central1-docker.pkg.dev/project-e985c781-9e31-44bf-bee/shortener/web:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/798087845729/locations/global/workloadIdentityPools/github/providers/github
          service_account: ci-pusher@project-e985c781-9e31-44bf-bee.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Let Docker use the registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Build and push
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf "%s\n" "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          latest=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$latest" != "$SHA" ]; then
            echo "Skipping deploy: $SHA is not the head of main ($latest)"
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" \
            "deploy $SHA"
      - name: Check health
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VM_USER@$VM_HOST" \
            "health"
